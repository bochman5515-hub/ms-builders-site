<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>О сервере — MS Builders</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:'Montserrat',sans-serif;background:radial-gradient(circle at top,#10213d 0%,#070b14 45%,#05070d 100%);color:white;min-height:100vh;overflow-x:hidden;padding:18px;padding-bottom:120px}
.container{max-width:1500px;margin:auto}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}
.left-column,.right-column{display:flex;flex-direction:column;gap:24px}
.card{position:relative;overflow:hidden;border-radius:30px;background:#0d1424;border:1px solid rgba(255,255,255,.05);min-height:320px;box-shadow:0 0 40px rgba(0,0,0,.35),inset 0 0 60px rgba(255,255,255,.02);transition:.25s;text-decoration:none;color:white}
.card:hover{transform:translateY(-4px);border-color:rgba(212,166,58,.35)}
.big-card{min-height:720px}
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.82}
.card::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(4,7,14,.97),rgba(4,7,14,.2))}
.card-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between;padding:36px}
.card h2{font-size:58px;line-height:.95;margin-bottom:18px;font-weight:800}
.card h2 span{color:#d4a63a}
.card p{max-width:380px;font-size:22px;line-height:1.5;color:#d2dae9}
.arrow-btn{width:72px;height:72px;border-radius:22px;border:1px solid rgba(212,166,58,.35);background:rgba(212,166,58,.08);display:flex;align-items:center;justify-content:center;font-size:34px;color:#d4a63a;transition:.2s}
.card:hover .arrow-btn{background:#d4a63a;color:black}
.reveal{opacity:0;transform:translateY(40px);transition:opacity .8s ease,transform .8s ease}
.reveal.visible{opacity:1;transform:translateY(0)}
@media(max-width:1100px){.grid{grid-template-columns:1fr}.big-card{min-height:560px}}
</style>
</head>
<body>
<div class="container">
<section class="hero reveal">
<h1><span>MS</span> BUILDERS</h1>
<p>ВАНИЛА+ СЕРВЕР С УНИКАЛЬНЫМИ МЕХАНИКАМИ</p>
</section>

<div class="grid">
<div class="left-column">
<a href="enchants.html" class="card reveal"><img src="images/enchants.png"><div class="card-content"><h2>ЧАРЫ</h2><div class="arrow-btn">⇒</div></div></a>
<a href="story.html" class="card reveal"><img src="images/story.png"><div class="card-content"><h2>СЮЖЕТ</h2><div class="arrow-btn">⇒</div></div></a>
<a href="activities.html" class="card reveal"><img src="images/activity.png"><div class="card-content"><h2>ЧЕМ ЗАНЯТЬСЯ</h2><div class="arrow-btn">⇒</div></div></a>
</div>
<div class="right-column">
<a href="crafts.html" class="card reveal"><img src="images/crafts.png"><div class="card-content"><h2>КРАФТЫ</h2><div class="arrow-btn">⇒</div></div></a>
<a href="features.html" class="card reveal"><img src="images/features.png"><div class="card-content"><h2>УНИКАЛЬНЫЕ ФИЧИ</h2><div class="arrow-btn">⇒</div></div></a>
<a href="news.html" class="card reveal"><img src="images/news.jpg"><div class="card-content"><h2>НОВОСТИ</h2><div class="arrow-btn">⇒</div></div></a>
</div>
</div>

<div class="grid" style="margin-top:24px">
<a href="rules.html" class="card reveal"><img src="images/rules.jpg"><div class="card-content"><h2>ПРАВИЛА</h2><div class="arrow-btn">⇒</div></div></a>
<a href="commands.html" class="card reveal"><img src="images/commands.jpg"><div class="card-content"><h2>КОМАНДЫ</h2><div class="arrow-btn">⇒</div></div></a>
</div>

<a href="msgame.html" class="card big-card reveal" style="margin-top:24px"><img src="images/msgame.jpg"><div class="card-content"><h2>MS<br><span>GAME</span></h2><div class="arrow-btn">⇒</div></div></a>
</div>

<script>
const reveals=document.querySelectorAll(".reveal");
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add("visible")}})},{threshold:.15});
reveals.forEach(el=>observer.observe(el));
</script>
</body>
</html>
